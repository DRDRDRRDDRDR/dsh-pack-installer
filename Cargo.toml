[package]
name = "dsh-pack-installer"
version = "1.0.0"
edition = "2021"
description = "DSH 全量分发包安装器：解压分卷、校验完整性、落盘到指定 DSH Home"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rfd = "0.14"

[profile.release]
opt-level = 2
lto = false
strip = true
